<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Тренажер Геодезиста — 643 питання</title>
<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --text: #1e293b;
    --muted: #64748b;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --success: #16a34a;
    --success-bg: #dcfce7;
    --danger: #dc2626;
    --danger-bg: #fee2e2;
    --border: #e2e8f0;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --success: #22c55e;
      --success-bg: #14532d;
      --danger: #ef4444;
      --danger-bg: #7f1d1d;
      --border: #334155;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding: 16px;
  }
  .container { max-width: 680px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 20px; }
  .header h1 { font-size: 1.4rem; margin: 0 0 6px; }
  .header p { margin: 0; color: var(--muted); font-size: 0.92rem; }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    border: 1px solid var(--border);
    margin-bottom: 16px;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 15px 18px;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    transition: transform 0.1s, background 0.2s;
    margin-bottom: 12px;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  .btn-small { padding: 10px 14px; font-size: 0.9rem; display: inline-block; width: auto; }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--card);
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    margin-bottom: 14px;
    font-weight: 600;
    font-size: 0.95rem;
    position: sticky;
    top: 10px;
    z-index: 10;
  }
  .timer { color: var(--primary); font-variant-numeric: tabular-nums; }
  .timer.warning { color: var(--danger); }
  .q-meta { font-size: 0.82rem; color: var(--muted); margin-bottom: 8px; }
  .q-text { font-size: 1.08rem; font-weight: 600; margin-bottom: 18px; }
  .option {
    display: flex;
    align-items: flex-start;
    width: 100%;
    text-align: left;
    background: var(--bg);
    color: var(--text);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
    font-size: 0.98rem;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .option-letter { font-weight: 700; margin-right: 10px; color: var(--primary); flex-shrink: 0; }
  .option.selected { border-color: var(--primary); background: rgba(37, 99, 235, 0.08); }
  .option.correct { border-color: var(--success); background: var(--success-bg); }
  .option.wrong { border-color: var(--danger); background: var(--danger-bg); }
  .explanation {
    margin-top: 14px;
    padding: 14px;
    border-radius: 10px;
    background: var(--bg);
    border-left: 4px solid var(--primary);
    font-size: 0.92rem;
  }
  .hidden { display: none !important; }
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .stat-box { background: var(--bg); padding: 12px; border-radius: 10px; text-align: center; border: 1px solid var(--border); }
  .stat-num { font-size: 1.3rem; font-weight: 700; color: var(--primary); }
  .stat-lbl { font-size: 0.8rem; color: var(--muted); }
  .search-input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 1rem;
    margin-bottom: 12px;
  }
  .mistake-item { border-bottom: 1px solid var(--border); padding: 12px 0; }
  .mistake-item:last-child { border-bottom: none; }
</style>
</head>
<body>
<div class="container">
  <div id="screen-menu">
    <div class="header">
      <h1>🧭 Тренажер Геодезиста</h1>
      <p>База сертифікаційних тестів: <strong id="total-db-cnt">0</strong> запитань</p>
    </div>

    <div class="card">
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-num" id="stat-passed">0</div>
          <div class="stat-lbl">Вивчено питань</div>
        </div>
        <div class="stat-box">
          <div class="stat-num" id="stat-mistakes">0</div>
          <div class="stat-lbl">Помилок у списку</div>
        </div>
      </div>

      <button class="btn btn-primary" onclick="startExam()">🎯 Іспит (50 питань / 45 хв)</button>
      <button class="btn btn-secondary" onclick="startPractice('random')">🎲 Випадкові питання (з поясненнями)</button>
      <button class="btn btn-secondary" onclick="startPractice('ordered')">📚 Усі питання по порядку</button>
      <button class="btn btn-secondary" onclick="startPractice('mistakes')">❌ Робота над помилками (<span id="btn-mistakes-cnt">0</span>)</button>
      <button class="btn btn-secondary" onclick="openSearch()">🔍 Пошук по базі питань</button>
    </div>
  </div>

  <div id="screen-quiz" class="hidden">
    <div class="top-bar">
      <span id="quiz-progress">1 / 50</span>
      <span id="quiz-timer" class="timer">45:00</span>
      <button class="btn btn-secondary btn-small" style="margin:0; padding:6px 10px;" onclick="confirmExit()">Вийти</button>
    </div>

    <div class="card">
      <div class="q-meta" id="q-id">Питання #1</div>
      <div class="q-text" id="q-text">Текст питання</div>
      <div id="q-options"></div>
      <div id="q-explanation" class="explanation hidden"></div>
    </div>

    <button id="btn-next" class="btn btn-primary hidden" onclick="nextQuestion()">Наступне питання ➔</button>
  </div>

  <div id="screen-result" class="hidden">
    <div class="card" style="text-align:center;">
      <h2 id="res-title" style="margin-top:0;">Результат іспиту</h2>
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-num" id="res-score">0 / 50</div>
          <div class="stat-lbl">Правильних відповідей</div>
        </div>
        <div class="stat-box">
          <div class="stat-num" id="res-time">00:00</div>
          <div class="stat-lbl">Витрачено часу</div>
        </div>
      </div>
      <p id="res-msg" style="font-weight:600;"></p>
      <button class="btn btn-primary" onclick="goMenu()">Повернутися в меню</button>
    </div>

    <div id="res-mistakes-card" class="card hidden">
      <h3 style="margin-top:0;">📋 Розбір помилок</h3>
      <div id="res-mistakes-list"></div>
    </div>
  </div>

  <div id="screen-search" class="hidden">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3 style="margin:0;">🔍 Пошук по базі</h3>
        <button class="btn btn-secondary btn-small" style="margin:0;" onclick="goMenu()">Назад</button>
      </div>
      <input type="text" id="search-box" class="search-input" placeholder="Введіть слово або номер питання..." oninput="doSearch()">
      <div id="search-results"></div>
    </div>
  </div>
</div>

<script src="questions_db.js"></script>
<script>
let DB = [];

async function initApp() {
  if (typeof QUESTIONS_DATA !== 'undefined') {
    DB = QUESTIONS_DATA;
  } else {
    try {
      const resp = await fetch('questions.json');
      DB = await resp.json();
    } catch (e) {
      alert('Не вдалося завантажити questions.json. Переконайтеся, що файл questions.json лежить поруч з index.html!');
    }
  }
  document.getElementById('total-db-cnt').textContent = DB.length;
  updateStats();
}

let state = {
  mode: 'exam',
  list: [],
  idx: 0,
  score: 0,
  answered: false,
  startTime: 0,
  timerInterval: null,
  examWrong: []
};

let savedMistakes = new Set(JSON.parse(localStorage.getItem('geo_mistakes') || '[]'));
let savedLearned = new Set(JSON.parse(localStorage.getItem('geo_learned') || '[]'));

function saveStorage() {
  localStorage.setItem('geo_mistakes', JSON.stringify([...savedMistakes]));
  localStorage.setItem('geo_learned', JSON.stringify([...savedLearned]));
  updateStats();
}

function updateStats() {
  document.getElementById('stat-passed').textContent = savedLearned.size;
  document.getElementById('stat-mistakes').textContent = savedMistakes.size;
  document.getElementById('btn-mistakes-cnt').textContent = savedMistakes.size;
}

function showScreen(id) {
  ['screen-menu', 'screen-quiz', 'screen-result', 'screen-search'].forEach(s => {
    document.getElementById(s).classList.add('hidden');
  });
  document.getElementById(id).classList.remove('hidden');
  window.scrollTo(0, 0);
}

function goMenu() {
  clearInterval(state.timerInterval);
  updateStats();
  showScreen('screen-menu');
}

function confirmExit() {
  if (confirm('Завершити поточний тест і вийти в меню?')) goMenu();
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startExam() {
  if (!DB.length) return;
  state.mode = 'exam';
  state.list = shuffle(DB).slice(0, 50);
  state.idx = 0;
  state.score = 0;
  state.examWrong = [];
  state.startTime = Date.now();
  
  const timerEl = document.getElementById('quiz-timer');
  timerEl.classList.remove('hidden', 'warning');
  
  clearInterval(state.timerInterval);
  const totalSec = 45 * 60;
  state.timerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
    const rem = totalSec - elapsed;
    if (rem <= 0) {
      clearInterval(state.timerInterval);
      finishQuiz(true);
      return;
    }
    const m = String(Math.floor(rem / 60)).padStart(2, '0');
    const s = String(rem % 60).padStart(2, '0');
    timerEl.textContent = `⏱ ${m}:${s}`;
    if (rem < 300) timerEl.classList.add('warning');
  }, 500);

  showScreen('screen-quiz');
  renderQuestion();
}

function startPractice(type) {
  if (!DB.length) return;
  state.mode = type;
  if (type === 'random') {
    state.list = shuffle(DB);
  } else if (type === 'ordered') {
    state.list = [...DB];
  } else if (type === 'mistakes') {
    if (savedMistakes.size === 0) {
      alert('У вас поки немає помилок у списку!');
      return;
    }
    state.list = shuffle(DB.filter(q => savedMistakes.has(q.id)));
  }
  state.idx = 0;
  state.score = 0;
  clearInterval(state.timerInterval);
  document.getElementById('quiz-timer').classList.add('hidden');
  showScreen('screen-quiz');
  renderQuestion();
}

function renderQuestion() {
  state.answered = false;
  const q = state.list[state.idx];
  document.getElementById('quiz-progress').textContent = `${state.idx + 1} / ${state.list.length}`;
  document.getElementById('q-id').textContent = `Питання #${q.id}`;
  document.getElementById('q-text').textContent = q.text;
  document.getElementById('q-explanation').classList.add('hidden');
  document.getElementById('btn-next').classList.add('hidden');

  const optsContainer = document.getElementById('q-options');
  optsContainer.innerHTML = '';
  const letters = ['А', 'Б', 'В', 'Г', 'Д'];

  q.answers.forEach((ans, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.innerHTML = `<span class="option-letter">${letters[i] || i+1})</span><span>${ans}</span>`;
    btn.onclick = () => selectAnswer(i, btn);
    optsContainer.appendChild(btn);
  });
}

function selectAnswer(chosenIdx, btnEl) {
  if (state.answered) return;
  state.answered = true;

  const q = state.list[state.idx];
  const isCorrect = (chosenIdx === q.correct);
  const allBtns = document.querySelectorAll('.option');

  if (isCorrect) {
    state.score++;
    savedMistakes.delete(q.id);
    savedLearned.add(q.id);
  } else {
    savedMistakes.add(q.id);
    if (state.mode === 'exam') {
      state.examWrong.push({ q, chosen: chosenIdx });
    }
  }
  saveStorage();

  if (state.mode === 'exam') {
    btnEl.classList.add('selected');
    setTimeout(() => nextQuestion(), 250);
  } else {
    allBtns[q.correct].classList.add('correct');
    if (!isCorrect) btnEl.classList.add('wrong');
    const expEl = document.getElementById('q-explanation');
    expEl.innerHTML = `<strong>${isCorrect ? '✅ Правильно!' : '❌ Помилка!'}</strong><br>${q.explanation}`;
    expEl.classList.remove('hidden');
    const nextBtn = document.getElementById('btn-next');
    nextBtn.textContent = (state.idx + 1 < state.list.length) ? 'Наступне питання ➔' : 'Завершити 🏁';
    nextBtn.classList.remove('hidden');
  }
}

function nextQuestion() {
  state.idx++;
  if (state.idx >= state.list.length) {
    finishQuiz(false);
  } else {
    renderQuestion();
  }
}

function finishQuiz(timeout) {
  clearInterval(state.timerInterval);
  const total = state.list.length;
  const pct = Math.round((state.score / total) * 100);
  document.getElementById('res-score').textContent = `${state.score} / ${total} (${pct}%)`;

  if (state.mode === 'exam') {
    const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
    const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
    const s = String(elapsed % 60).padStart(2, '0');
    document.getElementById('res-time').textContent = `${m}:${s}`;
    const passed = state.score >= 40;
    document.getElementById('res-title').textContent = timeout ? '⏰ Час вийшов!' : (passed ? '🎉 Іспит складено!' : '😔 Іспит не складено');
    document.getElementById('res-msg').textContent = passed
      ? 'Вітаємо! Ви набрали прохідний бал (від 40 з 50).'
      : 'Для успішного складання потрібно набрати щонайменше 40 балів із 50.';
  } else {
    document.getElementById('res-time').textContent = 'Тренування';
    document.getElementById('res-title').textContent = '✅ Блок завершено';
    document.getElementById('res-msg').textContent = 'Усі помилки автоматично збережено для повторення.';
  }

  const mCard = document.getElementById('res-mistakes-card');
  const mList = document.getElementById('res-mistakes-list');
  if (state.mode === 'exam' && state.examWrong.length > 0) {
    mCard.classList.remove('hidden');
    mList.innerHTML = state.examWrong.map(item => `
      <div class="mistake-item">
        <div style="font-weight:600; margin-bottom:4px;">#${item.q.id}. ${item.q.text}</div>
        <div style="color:var(--danger); font-size:0.9rem;">❌ Ваша відповідь: ${item.q.answers[item.chosen]}</div>
        <div style="color:var(--success); font-size:0.9rem; font-weight:600;">✔ Правильно: ${item.q.answers[item.q.correct]}</div>
        <div style="color:var(--muted); font-size:0.85rem; margin-top:4px;">📖 ${item.q.explanation}</div>
      </div>
    `).join('');
  } else {
    mCard.classList.add('hidden');
  }

  showScreen('screen-result');
}

function openSearch() {
  showScreen('screen-search');
  document.getElementById('search-box').value = '';
  document.getElementById('search-results').innerHTML = '<p style="color:var(--muted);">Введіть слово (наприклад: <em>нівелювання</em>, <em>УСК-2000</em>) або номер питання...</p>';
}

function doSearch() {
  const query = document.getElementById('search-box').value.trim().toLowerCase();
  const container = document.getElementById('search-results');
  if (!query) {
    container.innerHTML = '';
    return;
  }
  const found = DB.filter(q =>
    String(q.id) === query ||
    q.text.toLowerCase().includes(query) ||
    q.answers.some(a => a.toLowerCase().includes(query))
  ).slice(0, 30);

  if (found.length === 0) {
    container.innerHTML = '<p style="color:var(--muted);">Нічого не знайдено.</p>';
    return;
  }

  container.innerHTML = found.map(q => `
    <div class="mistake-item">
      <div style="font-weight:600; margin-bottom:4px;">#${q.id}. ${q.text}</div>
      <div style="color:var(--success); font-size:0.92rem; font-weight:600;">✔ ${q.answers[q.correct]}</div>
      <div style="color:var(--muted); font-size:0.85rem; margin-top:4px;">📖 ${q.explanation}</div>
    </div>
  `).join('');
}

initApp();
</script>
</body>
</html>
